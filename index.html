<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Liquid Gradient</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/addons/p5.sound.min.js"></script>
    <script src="https://unpkg.com/p5.fillgradient"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        font-family: monospace;
        overflow: hidden;
        height: 100vh;
      }
      #sidebar {
        width: 350px;
        background-color: #222;
        color: white;
        padding: 20px;
        box-sizing: border-box;
        height: 100%;
        overflow-y: auto;
        position: relative;
        transition: width 0.3s ease;
      }
      #sidebar.collapsed {
        width: 0;
        padding: 0;
        overflow: hidden;
      }
      #canvas-container {
        flex: 1;
        position: relative;
      }
      .control-group {
        margin-bottom: 20px;
      }
      h2, h3 {
        margin: 0 0 15px 0;
        font-size: 16px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }
      input[type="text"] {
        flex: 1;
        padding: 5px;
        background-color: #444;
        color: white;
        border: 1px solid #666;
        border-radius: 3px;
      }
      .color-input-container {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .color-preview {
        width: 20px;
        height: 20px;
        border: 1px solid #666;
        border-radius: 3px;
        flex-shrink: 0;
      }
      input[type="range"] {
        width: 100%;
        cursor: pointer;
        -webkit-appearance: none;
        height: 5px;
        background: #444;
        border-radius: 2px;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 15px;
        height: 15px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
      }
      .value-display {
        font-size: 12px;
        color: #ccc;
        float: right;
      }
      .collapse-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #444;
        color: white;
        border: none;
        border-radius: 3px;
        width: 30px;
        height: 30px;
        cursor: pointer;
        font-size: 16px;
        line-height: 20px;
        z-index: 10;
      }
      .expand-btn {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        border-radius: 3px;
        width: 30px;
        height: 30px;
        cursor: pointer;
        font-size: 16px;
        line-height: 20px;
        display: none;
        z-index: 10;
      }
      .save-btn {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 3px;
        padding: 10px 16px;
        cursor: pointer;
        font-size: 14px;
        z-index: 101;
        display: none;
      }
      @media (max-width: 768px) {
        body {
          position: relative;
        }
        #sidebar {
          position: absolute;
          width: 80%;
          height: 100vh;
          z-index: 100;
          transition: left 0.3s ease;
          left: 0;
        }
        #sidebar.collapsed {
          left: -80%;
          width: 80%;
        }
        #canvas-container {
          width: 100vw;
          height: 100vh;
        }
        .save-btn {
          display: block;
        }
        #save-hint {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h2>Controls</h2>
      <div class="control-group">
        <h3>Gradient Colors</h3>
        <div id="color-controls"></div>
      </div>
      <div class="control-group">
        <label>
          Distortion Intensity
          <span class="value-display" id="distortionFactorValue">0.150</span>
        </label>
        <input type="range" id="distortionFactor" min="0.001" max="0.2" step="0.001" value="0.15">
      </div>
      <div class="control-group">
        <label>
          Wave Influence
          <span class="value-display" id="waveFactorValue">0.20</span>
        </label>
        <input type="range" id="waveFactor" min="0.1" max="2.0" step="0.01" value="0.2">
      </div>
      <div class="control-group">
        <label>
          Noise Influence
          <span class="value-display" id="noiseFactorValue">0.5</span>
        </label>
        <input type="range" id="noiseFactor" min="0.1" max="20.0" step="0.1" value="0.5">
      </div>
      <p id="save-hint">Press 5 to save image</p>
    </div>
    <div id="canvas-container"></div>
    <script src="sketch.js"></script>
  </body>
</html>
