<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquid Gradient</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/addons/p5.sound.min.js"></script>
    <script src="https://unpkg.com/p5.fillgradient"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        font-family: monospace;
      }
      #sidebar {
        width: 300px;
        background-color: #222;
        color: white;
        padding: 20px;
        box-sizing: border-box;
        height: 100vh;
        overflow-y: auto;
        transition: width 0.3s ease;
      }
      #sidebar.collapsed {
        width: 0;
        padding: 0 0 0 10px;
        overflow: hidden;
      }
      #canvas-container {
        flex: 1;
      }
      .control-group {
        margin-bottom: 20px;
      }
      h2, h3 {
        margin: 0 0 15px 0;
        font-size: 16px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }
      input[type="range"] {
        width: 100%;
        cursor: pointer;
        -webkit-appearance: none;
        height: 5px;
        background: #444;
        border-radius: 2px;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 15px;
        height: 15px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
      }
      .value-display {
        font-size: 12px;
        color: #ccc;
        float: right;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h2>Controls</h2>

      <div class="control-group">
        <h3>Gradient Colors</h3>
        <div id="color-controls"></div>
      </div>

      <div class="control-group">
        <label>
          Distortion Intensity
          <span class="value-display" id="distortionFactorValue">0.150</span>
        </label>
        <input type="range" id="distortionFactor" min="0.001" max="0.2" step="0.001" value="0.15">
      </div>

      <div class="control-group">
        <label>
          Wave Influence
          <span class="value-display" id="waveFactorValue">0.20</span>
        </label>
        <input type="range" id="waveFactor" min="0.1" max="2.0" step="0.01" value="0.2">
      </div>

      <div class="control-group">
        <label>
          Noise Influence
          <span class="value-display" id="noiseFactorValue">0.5</span>
        </label>
        <input type="range" id="noiseFactor" min="0.1" max="20.0" step="0.1" value="0.5">
      </div>
    </div>

    <div id="canvas-container"></div>
    <button id="save-button" style="position: fixed; bottom: 20px; left: 20px; z-index: 1000; padding: 10px 15px; background-color: rgba(0,0,0,0.7); color: white; border: none; border-radius: 5px; cursor: pointer; font-family: monospace; pointer-events: auto;">Save Image</button>
